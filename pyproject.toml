[project]
name = "milvus3-demos"
version = "0.1.0"
description = "Three independent, self-contained Milvus 3.0 capability demos"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pymilvus==3.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [
    "demos/function-chain-rerank/backend/tests",
    "demos/embedding-list-max-sim/backend/tests",
    "demos/structarray-search/backend/tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
