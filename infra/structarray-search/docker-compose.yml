name: milvus3-demos-structarray-search

services:
  backend:
    container_name: milvus3-demos-structarray-search-backend
    image: milvus3-demos/structarray-search:local
    build:
      context: ../..
      dockerfile: demos/structarray-search/Dockerfile
    environment:
      COVLA_DATA_DIR: /data/covla
      STRUCTARRAY_PORT: "48030"
      STRUCTARRAY_RUNTIME_DIR: /workspace/artifacts/runtime/structarray-search
    network_mode: host
    volumes:
      - ${COVLA_DATA_DIR:?COVLA_DATA_DIR must be set to the approved CoVLA dataset root}:/data/covla:ro
      - ../../artifacts/runtime/structarray-search:/workspace/artifacts/runtime/structarray-search
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    init: true
    stop_grace_period: 30s
