name: milvus3-demos-ga

services:
  etcd:
    container_name: milvus3-demos-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ${MILVUS_RUNTIME_DIR:?MILVUS_RUNTIME_DIR must be set to a writable runtime directory}/volumes/etcd:/etcd
    command: >-
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    cpus: 1.0
    mem_limit: 2g
    restart: unless-stopped

  minio:
    container_name: milvus3-demos-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ${MILVUS_RUNTIME_DIR:?MILVUS_RUNTIME_DIR must be set to a writable runtime directory}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    cpus: 2.0
    mem_limit: 4g
    restart: unless-stopped

  standalone:
    container_name: milvus3-demos-milvus
    image: milvusdb/milvus:v3.0.0
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${MILVUS_RUNTIME_DIR:?MILVUS_RUNTIME_DIR must be set to a writable runtime directory}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "127.0.0.1:49530:19530"
      - "127.0.0.1:49091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    cpus: 8.0
    mem_limit: 16g
    restart: unless-stopped

networks:
  default:
    name: milvus3-demos-ga

