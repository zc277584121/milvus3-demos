name: milvus3-demos-movie-discovery

services:
  backend:
    container_name: milvus3-demos-movie-discovery-backend
    image: milvus3-demos/movie-discovery:local
    build:
      context: ../..
      dockerfile: demos/movie-discovery/Dockerfile
    environment:
      MOVIE_PORT: "48060"
      MOVIE_RUNTIME_DIR: /workspace/artifacts/runtime/movie-discovery
    network_mode: host
    volumes:
      - ../../artifacts/runtime/movie-discovery:/workspace/artifacts/runtime/movie-discovery
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    init: true
    stop_grace_period: 30s
