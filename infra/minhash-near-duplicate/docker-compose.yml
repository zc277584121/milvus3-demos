name: milvus3-demos-minhash-near-duplicate

services:
  backend:
    container_name: milvus3-demos-minhash-near-duplicate-backend
    image: milvus3-demos/minhash-near-duplicate:local
    build:
      context: ../..
      dockerfile: demos/minhash-near-duplicate/Dockerfile
    environment:
      MINHASH_PORT: "48050"
      MINHASH_RUNTIME_DIR: /workspace/artifacts/runtime/minhash-near-duplicate
    network_mode: host
    volumes:
      - ../../artifacts/runtime/minhash-near-duplicate:/workspace/artifacts/runtime/minhash-near-duplicate
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    init: true
    stop_grace_period: 30s
