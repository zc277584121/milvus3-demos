[project]
name = "minhash-near-duplicate-demo"
version = "3.0.0"
description = "MinHash + LSH near-duplicate detection demo backend"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "pymilvus==3.0.1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
minhash-near-duplicate = "minhash_near_dup_demo.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/minhash_near_dup_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
