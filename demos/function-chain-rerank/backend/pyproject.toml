[project]
name = "function-chain-demo"
version = "0.1.0"
description = "Independent backend boundary for the Function Chain rerank demo"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "minio>=7.2,<8",
    "milvus-demo-common",
    "numpy>=1.26,<3",
    "uvicorn>=0.35,<1",
    "xgboost>=3,<4",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.20,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[tool.uv.sources]
milvus-demo-common = { path = "../../../packages/python/milvus-demo-common", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/function_chain_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
