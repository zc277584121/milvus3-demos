[project]
name = "milvus-demo-common"
version = "0.1.0"
description = "Lightweight shared settings and Milvus health utilities"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic-settings>=2.10,<3",
    "pymilvus==3.0.1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/milvus_demo_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
