apiVersion: v1
kind: Service
metadata:
  name: milvus3-etcd
  namespace: demo
  labels:
    app.kubernetes.io/name: milvus3-etcd
    app.kubernetes.io/part-of: milvus-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: milvus3-etcd
  ports:
  - name: client
    port: 2379
    targetPort: client
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus3-etcd
  namespace: demo
  labels:
    app.kubernetes.io/name: milvus3-etcd
    app.kubernetes.io/part-of: milvus-demo
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: milvus3-etcd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: milvus3-etcd
        app.kubernetes.io/part-of: milvus-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.25
        command:
        - etcd
        - -advertise-client-urls=http://milvus3-etcd:2379
        - -listen-client-urls=http://0.0.0.0:2379
        - --data-dir=/etcd
        env:
        - name: ETCD_AUTO_COMPACTION_MODE
          value: revision
        - name: ETCD_AUTO_COMPACTION_RETENTION
          value: "1000"
        - name: ETCD_QUOTA_BACKEND_BYTES
          value: "4294967296"
        - name: ETCD_SNAPSHOT_COUNT
          value: "50000"
        ports:
        - name: client
          containerPort: 2379
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - etcdctl
            - endpoint
            - health
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - etcdctl
            - endpoint
            - health
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /etcd
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: milvus3-etcd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: milvus3-etcd
  namespace: demo
  labels:
    app.kubernetes.io/name: milvus3-etcd
    app.kubernetes.io/part-of: milvus-demo
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
