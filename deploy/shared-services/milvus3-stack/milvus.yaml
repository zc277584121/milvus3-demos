apiVersion: v1
kind: Service
metadata:
  name: milvus3
  namespace: demo
  labels:
    app.kubernetes.io/name: milvus3
    app.kubernetes.io/part-of: milvus-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: milvus3
  ports:
  - name: grpc
    port: 19530
    targetPort: grpc
    protocol: TCP
  - name: metrics
    port: 9091
    targetPort: metrics
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus3
  namespace: demo
  labels:
    app.kubernetes.io/name: milvus3
    app.kubernetes.io/part-of: milvus-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: milvus3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: milvus3
        app.kubernetes.io/part-of: milvus-demo
    spec:
      automountServiceAccountToken: false
      # The milvus image runs as uid 999 (milvus:milvus); ensure the data PVC
      # is group-writable by that user so standalone can initialize /var/lib/milvus.
      securityContext:
        fsGroup: 999
      containers:
      - name: milvus
        image: milvusdb/milvus:v3.0.0
        command:
        - milvus
        - run
        - standalone
        env:
        - name: MINIO_REGION
          value: us-east-1
        - name: ETCD_ENDPOINTS
          value: milvus3-etcd:2379
        - name: MINIO_ADDRESS
          value: milvus3-minio:9000
        - name: MINIO_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: milvus3-minio-secret
              key: access_key
        - name: MINIO_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: milvus3-minio-secret
              key: secret_key
        ports:
        - name: grpc
          containerPort: 19530
          protocol: TCP
        - name: metrics
          containerPort: 9091
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 20
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "8"
            memory: 16Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/milvus
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: milvus3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: milvus3
  namespace: demo
  labels:
    app.kubernetes.io/name: milvus3
    app.kubernetes.io/part-of: milvus-demo
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
