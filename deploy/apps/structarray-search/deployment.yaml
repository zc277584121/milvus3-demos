apiVersion: apps/v1
kind: Deployment
metadata:
  name: structarray-search
  namespace: demo
  labels:
    app.kubernetes.io/name: structarray-search
    app.kubernetes.io/part-of: milvus-demo
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: structarray-search
  template:
    metadata:
      labels:
        app.kubernetes.io/name: structarray-search
        app.kubernetes.io/part-of: milvus-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: structarray-search
        image: structarray-search:bootstrap
        imagePullPolicy: IfNotPresent
        env:
        - name: MILVUS_URI
          value: http://milvus3:19530
        - name: COVLA_DATA_DIR
          value: /data/covla
        - name: APP_ROOT_PATH
          value: /structarray-search
        - name: STRUCTARRAY_RUNTIME_DIR
          value: /tmp/runtime
        ports:
        - name: http
          containerPort: 48030
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: http
          # Cold start embeds 30 summaries + 519 observations and builds the
          # collection (~15s); give it comfortable runway.
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz/live
            port: http
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: covla
          mountPath: /data/covla
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: covla
        nfs:
          # TODO: replace with the SRE-approved NFS server/path for the approved
          # CoVLA 30-video slice. Remove this volume entirely once the demo
          # switches to fully synthetic generated frames.
          server: 10.1.2.68
          path: /covla-dataset
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: structarray-search-svc
  namespace: demo
  labels:
    app.kubernetes.io/name: structarray-search
    app.kubernetes.io/part-of: milvus-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: structarray-search
  ports:
  - name: http
    port: 48030
    targetPort: http
    protocol: TCP
