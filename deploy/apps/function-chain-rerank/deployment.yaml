apiVersion: apps/v1
kind: Deployment
metadata:
  name: function-chain-rerank
  namespace: demo
  labels:
    app.kubernetes.io/name: function-chain-rerank
    app.kubernetes.io/part-of: milvus-demo
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: function-chain-rerank
  template:
    metadata:
      labels:
        app.kubernetes.io/name: function-chain-rerank
        app.kubernetes.io/part-of: milvus-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: function-chain-rerank
        image: harbor-us1.zilliz.cc/uso/milvus3-demos-function-chain-rerank:v0.1.0
        imagePullPolicy: IfNotPresent
        env:
        - name: MILVUS_URI
          value: http://milvus3:19530
        - name: MINIO_ENDPOINT
          value: milvus3-minio:9000
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: milvus3-minio-secret
              key: access_key
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: milvus3-minio-secret
              key: secret_key
        - name: CLEANUP_ON_SHUTDOWN
          value: "false"
        - name: APP_ROOT_PATH
          value: /function-chain-rerank
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: http
          # Cold start trains the reranker, uploads the MinIO model, and builds
          # the collection (~30s).
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz/live
            port: http
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: function-chain-rerank-svc
  namespace: demo
  labels:
    app.kubernetes.io/name: function-chain-rerank
    app.kubernetes.io/part-of: milvus-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: function-chain-rerank
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
