apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-discovery
  namespace: demo
  labels:
    app.kubernetes.io/name: movie-discovery
    app.kubernetes.io/part-of: milvus-demo
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: movie-discovery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: movie-discovery
        app.kubernetes.io/part-of: milvus-demo
    spec:
      automountServiceAccountToken: false
      # The image runs as uid 10001; fsGroup makes the emptyDir volumes
      # (runtime dir and /tmp) writable by that user.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
      containers:
      - name: movie-discovery
        image: harbor-us1.zilliz.cc/uso/milvus3-demos-movie-discovery:v0.2.0
        imagePullPolicy: IfNotPresent
        env:
        - name: MILVUS_URI
          value: http://milvus3:19530
        - name: APP_ROOT_PATH
          value: /movie-discovery
        - name: MOVIE_RUNTIME_DIR
          value: /workspace/artifacts/runtime/movie-discovery
        ports:
        - name: http
          containerPort: 48060
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: http
          # Cold start embeds 90 synopses with the baked BGE-M3 ONNX model and
          # builds the HNSW collection; give it comfortable runway.
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz/live
            port: http
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: runtime
          mountPath: /workspace/artifacts/runtime/movie-discovery
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: runtime
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: movie-discovery-svc
  namespace: demo
  labels:
    app.kubernetes.io/name: movie-discovery
    app.kubernetes.io/part-of: milvus-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: movie-discovery
  ports:
  - name: http
    port: 48060
    targetPort: http
    protocol: TCP
