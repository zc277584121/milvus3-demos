server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    location = / {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /minhash-near-duplicate {
        return 308 /minhash-near-duplicate/;
    }

    location /minhash-near-duplicate/ {
        proxy_pass http://127.0.0.1:48050/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /minhash-near-duplicate;
        proxy_redirect off;
    }

    location / {
        return 404;
    }
}
