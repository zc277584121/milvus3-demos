apiVersion: apps/v1
kind: Deployment
metadata:
  name: minhash-near-duplicate
  namespace: demo
  labels:
    app.kubernetes.io/name: minhash-near-duplicate
    app.kubernetes.io/part-of: milvus-demo
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: minhash-near-duplicate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minhash-near-duplicate
        app.kubernetes.io/part-of: milvus-demo
    spec:
      automountServiceAccountToken: false
      # The image runs as uid 10001; fsGroup makes the emptyDir volumes
      # (runtime dir and /tmp) writable by that user.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
      containers:
      - name: minhash-near-duplicate
        image: harbor-us1.zilliz.cc/uso/milvus3-demos-minhash-near-duplicate:v0.2.0
        imagePullPolicy: IfNotPresent
        env:
        - name: MILVUS_URI
          value: http://milvus3:19530
        - name: APP_ROOT_PATH
          value: /minhash-near-duplicate
        - name: MINHASH_RUNTIME_DIR
          value: /workspace/artifacts/runtime/minhash-near-duplicate
        ports:
        - name: http
          containerPort: 48050
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: http
          # Cold start creates the MinHash schema + MINHASH_LSH index and
          # inserts 36 short documents; no model inference, so this is fast.
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz/live
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: runtime
          mountPath: /workspace/artifacts/runtime/minhash-near-duplicate
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: runtime
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minhash-near-duplicate-svc
  namespace: demo
  labels:
    app.kubernetes.io/name: minhash-near-duplicate
    app.kubernetes.io/part-of: milvus-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minhash-near-duplicate
  ports:
  - name: http
    port: 48050
    targetPort: http
    protocol: TCP
